name: Check the site

# Loads every page in a real browser and fails on a script error, a 404, a
# broken same-site link, or a docs page that could not load its Markdown.
# See scripts/check-site.mjs for why a browser and not a validator.
#
# Pages publishes from the branch on its own; this workflow only guards what
# gets there. It runs on a schedule too, because docs.html reads its
# documents from cruciblephp/crucible at view time: a document renamed or
# removed there breaks this site without any commit here.
#
# Every action is pinned to a commit SHA, never a tag — a tag can be moved,
# a SHA cannot. The same pins, and the same reasoning, as
# cruciblephp/crucible's own ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Every page loads, every link resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Pinned to an exact version for the same reason the actions are:
      # the check should change only when someone changes it.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Check the site
        run: node scripts/check-site.mjs
